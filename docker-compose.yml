services:
  mongodb:
    image: mongo:7.0
    container_name: muchtodo-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - muchtodo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_HOURS: "72"
      ENABLE_CACHE: "false"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - muchtodo-network

volumes:
  mongodb_data:

networks:
  muchtodo-network:
    driver: bridge
